name: PC Virtual - Ubuntu + Tailscale

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Instalar SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

      - name: Configurar SSH
        run: |
          sudo systemctl enable ssh
          sudo systemctl start ssh

          sudo useradd -m -s /bin/bash remoto || true
          echo "remoto:${{ secrets.SSH_PASSWORD }}" | sudo chpasswd
          sudo usermod -aG sudo remoto

      - name: Mostrar informações da máquina
        run: |
          echo "===================================="
          echo "PC VIRTUAL ONLINE"
          echo "===================================="
          echo "IP Tailscale:"
          tailscale ip -4
          echo "Usuário SSH: remoto"
          echo "===================================="
          tailscale status

      - name: Manter PC ligado
        run: |
          echo "PC virtual funcionando..."
          sleep 21000
